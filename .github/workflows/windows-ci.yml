name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Fetch verified FRP client
        shell: pwsh
        run: .\scripts\Fetch-Frpc.ps1

      - name: Restore dependencies
        run: dotnet restore .\FrpDesk.sln

      - name: Run tests
        run: dotnet test .\tests\FrpDesk.Tests\FrpDesk.Tests.csproj -c Release --no-restore

      - name: Publish Windows app
        run: dotnet publish .\FrpDesk.WinUI\FrpDesk.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o "$env:RUNNER_TEMP\FrpDesk"
