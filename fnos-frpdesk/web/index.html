<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FrpDesk</title>
  <link rel="stylesheet" href="/app/frpdesk/app.css?v=0.1.13">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><img src="/app/frpdesk/icon.png" alt="" width="28" height="28"><strong>FrpDesk</strong></div>
      <nav id="nav" aria-label="主导航">
        <button data-page="dashboard" class="active" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>概览</button>
        <button data-page="configs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg>配置实例</button>
        <button data-page="addresses"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M9 5h10v10M5 9v10h10"/></svg>穿透地址</button>
        <button data-page="logs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>运行日志</button>
        <button data-page="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M8 3v6M16 9v6M10 15v6"/></svg>设置</button>
      </nav>
    </aside>
    <main class="main">
      <header class="page-header">
        <h1 id="page-title">概览</h1>
        <div class="header-actions"><span id="connection" class="connection">连接中</span><button id="import-button" class="btn primary" data-command="import">导入 TOML</button></div>
      </header>
      <section id="content" class="content" aria-labelledby="page-title"></section>
    </main>
  </div>
  <dialog id="import-dialog" aria-labelledby="import-title">
    <form id="import-form">
      <div class="dialog-header"><h2 id="import-title">导入 TOML 配置</h2><button type="button" class="icon-button" data-command="close-import" aria-label="关闭导入窗口">×</button></div>
      <p class="muted">粘贴配置内容，每个配置独立运行。</p>
      <div class="field"><label for="import-filename">文件名</label><input id="import-filename" name="filename" value="frpc.toml" required pattern=".+\.[tT][oO][mM][lL]" autocomplete="off"></div>
      <div class="field"><label for="import-content">TOML 内容</label><textarea id="import-content" class="editor" name="content" required spellcheck="false" placeholder='serverAddr = "example.com"&#10;serverPort = 7000'></textarea></div>
      <p id="import-error" class="notice hidden" role="alert"></p>
      <div class="dialog-footer"><button type="button" class="btn" data-command="close-import">取消</button><button id="import-submit" type="submit" class="btn primary">导入配置</button></div>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script src="/app/frpdesk/app.js?v=0.1.13"></script>
</body>
</html>
